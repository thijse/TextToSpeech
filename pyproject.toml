[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texttospeech"
version = "0.1.0"
description = "Multi-Backend Text-to-Speech Generator with Phonetics  Support"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Thijs Elenbaas"}
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "azure-cognitiveservices-speech>=1.30.0",
    "elevenlabs>=0.2.0",
    "pyyaml>=6.0",
    "python-pptx>=0.6.21",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "numpy>=1.21.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
tts = "texttospeech.cli.tts_cli:main"
phonetics = "texttospeech.cli.phonetics_cli:main"

[project.urls]
Homepage = "https://github.com/thijse/TextToSpeech"
Repository = "https://github.com/thijse/TextToSpeech"
Issues = "https://github.com/thijse/TextToSpeech/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --tb=short"
minversion = "7.0"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]
